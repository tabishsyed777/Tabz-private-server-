services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tabzzat}
      POSTGRES_USER: ${POSTGRES_USER:-tabzzat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: infrastructure/oracle/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tabzzat}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-tabzzat}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-15m}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-1024}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - postgres
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infrastructure/oracle/Dockerfile.web
    ports:
      - 127.0.0.1:8080:80
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
